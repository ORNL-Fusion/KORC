name: agate-regression
on: [ push, workflow_dispatch ]

jobs:
  job_one:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Compatible Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: spack cache
        id: spack-cache
        uses: actions/cache@v3
        with:
          # Fixed static key acting as your testing baseline
          key: spack-cache-sandlot-8
          path: |
            ./spack
            ~/.spack

      - name: grab spack
        if: ${{ steps.spack-cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: 'spack/spack'
          ref: 'v0.21.1'
          path: './spack'

      - name: spack install
        run: |
          . ./spack/share/spack/setup-env.sh
          
          # Initialize configuration settings if we have a fresh cache slot
          if [ "${{ steps.spack-cache.outputs.cache-hit }}" != "true" ]; then
            spack config add config:install_tree:padded_length:128
            spack compiler find
            
            # FORCE SPACK TO PREFER THE STABLE PRE-INSTALLED GCC 14.3.0 OVER THE BUGGY GCC 15
            spack config add "packages:all:compiler:[gcc@14.3.0]"
          fi
          
          # Directly build your targets against the discovered gcc@14.3.0 toolchain
          spack install --no-cache cmake %gcc@14.3.0
          spack install --no-cache hdf5+fortran+mpi %gcc@14.3.0
          spack gc -y




  job_two:
    needs: job_one
    runs-on: ubuntu-latest
    steps:
      - name: Get number of CPU cores
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores
      - name: grab main project
        uses: actions/checkout@v4
        with:
          path: './KORC'

      - name: spack cache
        id: spack-cache
        uses: actions/cache@v3
        with:
          key: spack-cache-sandlot-8
          path: |
            ./spack
            ~/.spack

      - name: build korc
        run: |

          pwd
          tree -L 2

          . ./spack/share/spack/setup-env.sh

          #spack find -ldf
          spack compilers

          #spack load gcc@14.3.0
          spack load cmake             %gcc@14.3.0
          spack load hdf5+fortran+mpi  %gcc@14.3.0

          set -x
          which cmake     && cmake     --version
          which gfortran  && gfortran  --version
          which h5diff    && h5diff    --version
          set -x

          cd ./KORC
          ./build.sh

      - name: test korc
        run: |
          . ./spack/share/spack/setup-env.sh
          spack load hdf5+fortran+mpi  %gcc@14.3.0
          
          ./KORC/ci_stub/agate_job_test.sh

      - name: Show Cache
        if: failure()
        shell: bash
        run: |
          tree -L 2
          pwd
          ls -la
          cat ./KORC/build/CMakeCache.txt


